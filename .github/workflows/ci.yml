name: CI

on:
  push:
    branches: [main]
  pull_request:

# No secrets are configured for this workflow by design.
# `next build` on this repository succeeds without Supabase credentials because
# every dashboard route is server-rendered on demand rather than prerendered.
# If a future change makes the build require credentials, add non-secret
# placeholder values here — never real keys.
permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Unit tests
        run: npm run test:run

      - name: Production build
        run: npm run build
